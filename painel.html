<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Player TV — Painel</title><link rel="stylesheet" href="styles.css"></head><body><header class="topbar"><h1>Player TV — Painel</h1><button id="refreshBtn" class="secondary">Atualizar</button></header><main class="container"><section class="card"><h2 style="margin-top:0">Adicionar mídia</h2><p>Envie vídeos MP4 ou imagens JPG/PNG/WEBP. Para imagens, defina quantos segundos ficam na tela.</p><div class="row"><input id="fileInput" type="file" accept="video/mp4,image/jpeg,image/png,image/webp"><label>Imagem por <input id="defaultImageDuration" type="number" min="1" max="3600" value="10"> segundos</label><button id="uploadBtn">Adicionar mídia</button></div><div class="progress" id="progress"><div id="progressBar"></div></div><div id="status" class="status" style="margin-top:12px">Aguardando...</div></section><section class="card"><div class="row" style="justify-content:space-between"><div><h2 style="margin:0">Playlist</h2><p style="margin-bottom:0;color:#6b7280">Arraste pelo símbolo ☰ para mudar a ordem.</p></div><button id="saveOrderBtn">Salvar ordem</button></div></section><section class="card"><div id="mediaList" class="media-list"></div></section><section class="card"><h3 style="margin-top:0">Link da TV</h3><p>Depois de publicar, abra na TV:</p><code id="playerUrl">player.html</code></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="painel.js"></script></body></html>
