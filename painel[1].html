<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Player TV — Painel</title><link rel="stylesheet" href="styles.css">
<style>
.tabs{display:flex;gap:8px;margin-bottom:18px}.tabbtn{background:#e5e7eb;color:#111827}.tabbtn.active{background:#2563eb;color:#fff}
.tab{display:none}.tab.active{display:block}.device{display:grid;grid-template-columns:1fr auto auto auto;gap:12px;align-items:center;border:1px solid #e5e7eb;border-radius:14px;padding:14px;margin-bottom:10px}
.badge{padding:7px 10px;border-radius:999px;font-weight:700}.on{background:#dcfce7;color:#166534}.off{background:#fee2e2;color:#991b1b}
</style>
</head>
<body>
<header class="topbar"><h1>Player TV — Painel</h1><button id="refreshBtn" class="secondary">Atualizar</button></header>
<main class="container">
<div class="tabs"><button class="tabbtn active" data-tab="playlist">Playlist</button><button class="tabbtn" data-tab="devices">Aparelhos</button></div>

<section id="playlist" class="tab active">
<section class="card"><h2 style="margin-top:0">Adicionar mídia</h2><div class="row">
<input id="fileInput" type="file" accept="video/mp4,image/jpeg,image/png,image/webp">
<label>Imagem por <input id="defaultImageDuration" type="number" min="1" max="3600" value="10"> segundos</label>
<button id="uploadBtn">Adicionar mídia</button></div>
<div class="progress" id="progress"><div id="progressBar"></div></div><div id="status" class="status" style="margin-top:12px">Aguardando...</div></section>
<section class="card"><div class="row" style="justify-content:space-between"><div><h2 style="margin:0">Playlist</h2><p style="margin-bottom:0;color:#6b7280">Arraste ☰ para mudar a ordem.</p></div><button id="saveOrderBtn">Salvar ordem</button></div></section>
<section class="card"><div id="mediaList" class="media-list"></div></section>
<section class="card"><h3 style="margin-top:0">Link da TV</h3><code id="playerUrl">player.html</code></section>
</section>

<section id="devices" class="tab">
<section class="card"><div class="row" style="justify-content:space-between"><div><h2 style="margin:0">Aparelhos conectados</h2><p style="margin-bottom:0;color:#6b7280">Online = sinal recebido nos últimos 90 segundos.</p></div><button id="refreshDevices">Atualizar aparelhos</button></div></section>
<section class="card"><div id="deviceList"></div></section>
</section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="painel.js"></script>
</body></html>
