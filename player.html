<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Player TV</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;font-family:Arial}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000}
#stage video,#stage img{width:100%;height:100%;object-fit:contain}
#register{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:#0b1220;z-index:20}
.card{width:min(520px,90vw);background:#fff;padding:28px;border-radius:20px;text-align:center}
.card input,.card button{width:100%;padding:16px;font-size:20px;border-radius:12px;box-sizing:border-box}
.card input{border:1px solid #ccc;margin:12px 0}.card button{border:0;background:#2563eb;color:#fff;font-weight:700}
#msg,#tap{position:fixed;inset:0;display:none;align-items:center;justify-content:center;color:#fff;background:#000;z-index:8;font-size:26px;text-align:center}
#tap{background:rgba(0,0,0,.75);z-index:10}
</style>
</head>
<body>
<div id="stage"></div>
<div id="msg">Carregando...</div>
<div id="tap">Pressione OK / Enter para iniciar</div>
<div id="register">
  <div class="card">
    <h1>Cadastre seu nome</h1>
    <p>Digite um nome para identificar esta TV.</p>
    <input id="deviceName" maxlength="80" placeholder="Ex.: Escola A - Recepção">
    <button id="registerBtn">Cadastrar e iniciar</button>
    <div id="err"></div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="player.js"></script>
</body>
</html>
