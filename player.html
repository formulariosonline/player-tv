<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Player TV</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;font-family:Arial,sans-serif}#stage{position:fixed;inset:0;background:#000;display:flex;align-items:center;justify-content:center}#stage video,#stage img{width:100%;height:100%;object-fit:contain;background:#000}#message,#startOverlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;text-align:center;padding:30px;background:#000;color:#fff;font-size:28px;z-index:5}#startOverlay{background:rgba(0,0,0,.72);z-index:10}#pauseBadge{position:fixed;right:24px;bottom:24px;background:rgba(0,0,0,.65);color:white;border-radius:12px;padding:12px 16px;display:none;z-index:8;font-size:20px}</style></head><body><div id="stage"></div><div id="message">Carregando programação...</div><div id="startOverlay">Pressione OK / Enter para iniciar</div><div id="pauseBadge">⏸ Pausado</div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="player.js"></script></body></html>
